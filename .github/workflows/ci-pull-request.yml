name: CI - Pull Request

# Validates every pull request targeting the default branch: formatting,
# validation, and a dev plan whose add/change/destroy summary is posted as a
# single, continuously-updated PR comment. No apply runs in this workflow.

on:
  pull_request:
    branches: [main]

# Least-privilege token permissions.
permissions:
  id-token: write # assume the dev deployment role via OIDC
  contents: read # checkout
  pull-requests: write # upsert the plan-summary comment
  security-events: write # upload Trivy SARIF results to the Security tab

env:
  TF_VERSION: "1.16.1" 
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-south-1
  WORKDIR: environments/dev

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Security scan (Trivy): IaC misconfiguration + secret detection. Runs first,
  # needs no AWS credentials, and gates the plan job (see `needs:` below) so a
  # HIGH/CRITICAL finding or a detected secret fails the PR before any plan.
  # Trivy's `config` scanner includes the tfsec Terraform ruleset; the `fs`
  # secret scanner closes the plaintext-secret.
  # -------------------------------------------------------------------------
  security-scan:
    name: security scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IaC misconfiguration scan of the Terraform. Produces SARIF (uploaded
      # below) and does NOT fail the job here (exit-code 0) so both the config
      # and secret results can be collected before the gate step.
      - name: Trivy IaC misconfig scan (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          # Pin the Trivy BINARY to a modern release. The version bundled with
          # this action tag (0.69.3) panics ("value is null") while adapting
          # the AWS provider's `default_tags` when a tag value can't be
          # resolved (e.g. `module.tagging.tags` or unset `var.owner`/
          # `var.cost_center`). The crash aborts the scan with exit 2 and no
          # SARIF is written — which is what makes the upload step fail with
          # "Path does not exist: trivy-config.sarif". See
          # https://github.com/aquasecurity/trivy/discussions/9523
          version: v0.76.1
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Upload IaC scan results to Security tab
        # Only upload when the scan actually produced the report. Guarding on
        # the file's existence (rather than always()) keeps a failed/empty scan
        # from turning into a confusing "Path does not exist" error here.
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # Gate 1 — IaC misconfigurations (HIGH/CRITICAL).
      # REPORT-ONLY for now (exit-code 0): prints findings and uploads SARIF so
      # you can triage the baseline and add a .trivyignore for accepted items.
      # To ENFORCE (fail the PR on findings), change exit-code to "1".
      - name: Trivy IaC misconfig gate (report-only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.76.1 # avoid the 0.69.3 default_tags panic (see SARIF step)
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0" # report-only; set to "1" to enforce
          severity: HIGH,CRITICAL

      # Gate 2 — secret detection in the working tree (Req 8.5).
      # REPORT-ONLY for now (exit-code 0). To ENFORCE, change exit-code to "1".
      # A leaked secret is high-impact, so this is a strong candidate to enforce
      # (exit-code "1") as soon as the baseline is confirmed clean.
      - name: Trivy secret scan gate (report-only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.76.1 # keep the Trivy binary consistent across steps
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "0" # report-only; set to "1" to enforce
          severity: HIGH,CRITICAL

  validate-and-plan:
    name: fmt, validate, plan (dev)
    runs-on: ubuntu-latest
    needs: security-scan # block the plan unless the security scan passes
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt -check
        id: fmt
        run: terraform fmt -check -recursive

      # ---- Validate all roots -----------------------------
      # init with -backend=false needs no state/credentials; the committed lock
      # is enforced read-only so providers never upgrade. Validating
      # every root (not just dev) catches more on the PR gate.
      - name: Terraform validate (all roots)
        run: |
          set -euo pipefail
          for dir in environments/dev environments/prod bootstrap; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -lockfile=readonly -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      # ---- OIDC auth (keyless) for the dev plan --------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600 

      # ---- Init the dev root against remote state -------------
      - name: Terraform init (dev)
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -input=false -no-color

      - name: Terraform plan (dev)
        id: plan
        working-directory: ${{ env.WORKDIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          set -o pipefail
          terraform plan -input=false -lock-timeout=300s -no-color \
            -var-file=dev.tfvars -out=tfplan 2>&1 | tee plan_output.txt

      # ---- Extract add/change/destroy counts ------------------
      # Counts match Terraform's own summary semantics: a replacement
      # (actions ["delete","create"]) is counted as BOTH an add and a destroy,
      # so an action list is "add" if it contains create, "destroy" if it
      # contains delete, and "change" when it is exactly ["update"].
      - name: Summarize plan
        if: always() && steps.plan.outcome == 'success'
        id: summary
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > plan.json
          ADD=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' plan.json)
          CHG=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' plan.json)
          DEL=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
          echo "add=$ADD"     >> "$GITHUB_OUTPUT"
          echo "change=$CHG"  >> "$GITHUB_OUTPUT"
          echo "destroy=$DEL" >> "$GITHUB_OUTPUT"

      # ---- Upsert exactly one plan-summary comment ------------
      - name: Upsert plan summary comment
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_ADD: ${{ steps.summary.outputs.add }}
          PLAN_CHANGE: ${{ steps.summary.outputs.change }}
          PLAN_DESTROY: ${{ steps.summary.outputs.destroy }}
        with:
          script: |
            const marker = '<!-- tf-plan-summary:dev -->';
            const sha = context.sha.substring(0, 7);
            const planOk = process.env.PLAN_OUTCOME === 'success';
            const add = process.env.PLAN_ADD || '0';
            const change = process.env.PLAN_CHANGE || '0';
            const destroy = process.env.PLAN_DESTROY || '0';

            // Build the body line-by-line, left-aligned, so no stray leading
            // whitespace turns the Markdown into a code block.
            const body = planOk
              ? [
                  marker,
                  '### Terraform Plan — dev',
                  '',
                  '| Action | Count |',
                  '| ------ | ----- |',
                  `| add | ${add} |`,
                  `| change | ${change} |`,
                  `| destroy | ${destroy} |`,
                  '',
                  `_Plan for \`environments/dev\` at ${sha}._`,
                ].join('\n')
              : [
                  marker,
                  '### Terraform Plan — dev (failed)',
                  '',
                  'The dev plan did not complete. See the workflow logs for details. No apply will run.',
                  '',
                  `_Commit ${sha}._`,
                ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # If the plan failed, fail the job AFTER the comment is posted so the PR
      # check is red and no downstream apply can run.
      - name: Fail if plan failed
        if: always() && steps.plan.outcome == 'failure'
        run: |
          echo "::error::Terraform dev plan failed — see logs. No apply will run."
          exit 1
