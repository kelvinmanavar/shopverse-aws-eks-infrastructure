name: Destroy

# Manual teardown of an environment after testing.
#
# Run from: Actions -> Destroy -> Run workflow.
#   - Pick the environment (dev or prod).
#   - Type the environment name again in `confirm` as a safety check.
#
# Credentials use the same OIDC deploy roles as CD. The `prod` GitHub
# Environment's required-reviewer gate also applies to prod destroys.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.16.1"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-south-1

jobs:
  destroy:
    name: destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    # Share the group with deploys so destroy never overlaps an apply.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    steps:
      - name: Verify confirmation and branch
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "Confirmation '$CONFIRM' does not match environment '$ENVIRONMENT'." >&2
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Destroy must be run from main." >&2
            exit 1
          fi
        working-directory: .

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && vars.PROD_DEPLOY_ROLE_ARN || vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Terraform init
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -input=false -no-color

      - name: Terraform plan (destroy)
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -destroy -input=false -lock-timeout=300s -no-color -var-file=${{ inputs.environment }}.tfvars -out=destroy.tfplan

      - name: Terraform destroy
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -input=false -lock-timeout=300s -no-color -auto-approve destroy.tfplan
