name: CD - Deploy

# Continuous deployment on merge to the default branch.
#
#   deploy-dev  : auto plan + apply to dev, serialized so merges apply one at a
#                 time in order (Req 5.1-5.5).
#   deploy-prod : plan prod, pause on the `prod` GitHub Environment required-
#                 reviewer gate, then apply the EXACT saved plan on approval
#                 (Req 6.1-6.3, 6.5, 6.8).
#
# The prod approval, 72-hour timeout, rejection, and unauthorized-approver
# handling are enforced by the `prod` GitHub Environment protection rules
# (configured in repo settings), not in YAML.
#
# Required repo configuration (from bootstrap outputs):
#   Variables: AWS_REGION, DEV_DEPLOY_ROLE_ARN, PROD_DEPLOY_ROLE_ARN, TF_STATE_BUCKET
#   Secrets:   DB_PASSWORD (only used if manage_master_user_password = false)

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual release runs

permissions:
  id-token: write # OIDC role assumption
  contents: read

env:
  TF_VERSION: "1.16.1" # single pinned patch, identical to CI (Req 10.2)
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-south-1

jobs:
  # =========================================================================
  # DEV — automatic apply on merge, serialized.
  # =========================================================================
  deploy-dev:
    name: deploy dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    # Serialize dev deployments: queued runs execute one at a time in merge
    # order; never cancel an in-flight apply (Req 5.5).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4 
        with:
          role-to-assume: ${{ vars.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Terraform init (dev)
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -input=false -no-color

      # Plan first; a plan failure fails the run and the apply step is skipped
      # (Req 5.4).
      - name: Terraform plan (dev)
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -input=false -lock-timeout=300s -no-color -var-file=dev.tfvars -out=tfplan

      # Apply the exact saved plan. On failure the run is marked failed and
      # already-applied resources remain; the next run reconciles (Req 5.2, 5.3).
      - name: Terraform apply (dev)
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -input=false -lock-timeout=300s -no-color -auto-approve tfplan

  # =========================================================================
  # PROD — gated apply. The `prod` environment protection rule pauses this job
  # until an authorized reviewer approves; only then do plan+apply run.
  # =========================================================================
  deploy-prod:
    name: deploy prod (gated)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod # required-reviewer gate + default-branch restriction
    timeout-minutes: 60
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Prod role is assumable only from the default branch (enforced by the
      # role trust policy in bootstrap/).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Terraform init (prod)
        run: terraform init -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -input=false -no-color

      # Produce the saved plan that will be applied verbatim after approval
      # (Req 6.1, 6.5).
      - name: Terraform plan (prod)
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -input=false -lock-timeout=300s -no-color -var-file=prod.tfvars -out=tfplan

      # Retain the saved plan as a build artifact for traceability.
      - name: Upload prod plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan-${{ github.sha }}
          path: environments/prod/tfplan
          retention-days: 7
          if-no-files-found: error

      # Apply the EXACT saved plan. On failure the run is marked failed and the
      # deployment halts with no automatic retry (Req 6.8).
      - name: Terraform apply (prod)
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -input=false -lock-timeout=300s -no-color -auto-approve tfplan
